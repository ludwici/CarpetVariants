plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-fabric-${minecraft_version}"
}

repositories {
	mavenCentral()
	maven {
		url "https://cursemaven.com"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"carpetvariants" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "curse.maven:carpets-core-1140721:${carpetscore_file_id}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}

publishMods {
    file = tasks.named("jar", Jar).flatMap { it.archiveFile }
    changelog = ""
    version = "${minecraft_version}-${mod_version}"
    displayName = tasks.named("jar", Jar).flatMap { it.archiveFile }.map { it.asFile.name }
    type = STABLE
    modLoaders.add("fabric")
    dryRun = providers.gradleProperty("publishDryRun").map { it.toBoolean() }.orElse(false)

    curseforge {
        projectId = "1035201"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_25)
        client = true
        server = true
        requires("carpets-core")
        requires("fabric-api")
    }

    modrinth {
        projectId = "GOhfXKze"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        version = "${minecraft_version}-${mod_version}-fabric"
        displayName = "Carpet Variants ${mod_version} (Fabric ${minecraft_version})"
        minecraftVersions.add(minecraft_version)
        requires("carpets-core")
        requires("fabric-api")
    }
}
