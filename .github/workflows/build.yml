name: Build
on:
  push:
    branches: ['1.21.11']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    name: neoforge (1.21.11)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: bash ./gradlew build --no-daemon
      - name: Upload distributable JAR
        uses: actions/upload-artifact@v4
        with:
          name: carpetvariants-neoforge-1.21.11
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 30
