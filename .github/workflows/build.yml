name: Build

on:
  push:
    branches: ['1.21.4']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: NeoForge (1.21.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: bash ./gradlew :neoforge:build --no-daemon
      - name: Upload distributable JAR
        uses: actions/upload-artifact@v4
        with:
          name: carpetvariants-neoforge-1.21.4
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-dev.jar
            !neoforge/build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 30
