name: Build
on:
  push:
    branches: ['26.3']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    name: ${{ matrix.loader }} (26.3)
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v4
        with:
          path: variants
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Regenerate NeoForge resources and loot tables
        if: matrix.loader == 'neoforge'
        working-directory: variants/neoforge
        run: bash ./gradlew runData --no-daemon
      - name: Build Carpet Variants
        working-directory: variants/${{ matrix.loader }}
        run: bash ./gradlew build --no-daemon
      - name: Validate CurseForge and Modrinth publication (dry run)
        working-directory: variants/${{ matrix.loader }}
        env:
          CURSEFORGE_TOKEN: dry-run-only
          MODRINTH_TOKEN: dry-run-only
        run: bash ./gradlew publishMods -PpublishDryRun=true --no-daemon --stacktrace
      - name: Upload distributable JAR
        uses: actions/upload-artifact@v4
        with:
          name: carpetvariants-${{ matrix.loader }}-26.3
          path: |
            variants/${{ matrix.loader }}/build/libs/*.jar
            !variants/${{ matrix.loader }}/build/libs/*-sources.jar
            !variants/${{ matrix.loader }}/build/libs/*-dev.jar
            !variants/${{ matrix.loader }}/build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 30
