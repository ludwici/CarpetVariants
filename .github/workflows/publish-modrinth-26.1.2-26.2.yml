name: Publish Carpet Variants 26.1.2 and 26.2 to Modrinth

run-name: ${{ inputs.dry_run && 'Validate' || 'Publish' }} Carpet Variants 26.1.2 / 26.2 on Modrinth

on:
  push:
    branches: ['1.21']
    paths:
      - '.github/publish-requests/carpetvariants-legacy-modrinth.txt'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate without uploading (dry run)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: carpetvariants-legacy-modrinth-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-carpetvariants-legacy-modrinth]'))
    name: ${{ matrix.minecraft }} / ${{ matrix.loader }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        minecraft: ['26.1.2', '26.2']
        loader: [fabric, neoforge]
    steps:
      - name: Checkout Carpet Variants Minecraft ${{ matrix.minecraft }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.minecraft }}
          path: variants
      - name: Checkout matching CarpetsCore
        uses: actions/checkout@v4
        with:
          repository: ludwici/CarpetsCore
          ref: ${{ matrix.minecraft }}
          path: core
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install CarpetsCore into local Maven
        working-directory: core/${{ matrix.loader }}
        run: bash ./gradlew publishToMavenLocal --no-daemon
      - name: Check Modrinth token
        if: ${{ !inputs.dry_run }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          test -n "$MODRINTH_TOKEN" || { echo "MODRINTH_TOKEN is not configured"; exit 1; }
      - name: Publish to Modrinth
        working-directory: variants/${{ matrix.loader }}
        env:
          MODRINTH_TOKEN: ${{ inputs.dry_run && 'dry-run-only' || secrets.MODRINTH_TOKEN }}
        run: bash ./gradlew publishMods -PpublishDryRun=${{ github.event_name == 'push' && 'false' || inputs.dry_run }} --no-daemon --stacktrace
